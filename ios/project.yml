name: CarMechanicAR
options:
  bundleIdPrefix: com.azadistudio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_LANGUAGE: fa
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  CarMechanicAR:
    type: application
    platform: iOS
    sources:
      - path: CarMechanicAR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azadistudio.CarMechanicAR
        INFOPLIST_KEY_CFBundleDisplayName: "مکانیک AR"
        INFOPLIST_KEY_NSCameraUsageDescription: "برای شناسایی قطعات خودرو، برنامه به دسترسی دوربین نیاز دارد."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "برای تحلیل تصاویر خودرو از گالری، دسترسی به تصاویر لازم است."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets: []
