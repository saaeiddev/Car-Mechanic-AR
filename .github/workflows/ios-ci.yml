name: iOS Build Check

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project CarMechanicAR.xcodeproj \
            -scheme CarMechanicAR \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          APP_PATH=$(find ios/DerivedData/Build/Products -maxdepth 2 -type d -name 'CarMechanicAR.app' | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" CarMechanicAR-iOS-Simulator.zip

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: CarMechanicAR-iOS-Simulator
          path: CarMechanicAR-iOS-Simulator.zip
          if-no-files-found: error
