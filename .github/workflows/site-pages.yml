name: Car Mechanic AR Web App

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'scripts/prepare_web_ai_model.py'
      - '.github/workflows/site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model export tools
        run: python -m pip install --upgrade pip && pip install "ultralytics>=8.3,<9" "huggingface_hub>=0.28" "onnx>=1.17,<2"
      - name: Prepare browser AI model
        run: python scripts/prepare_web_ai_model.py
      - name: Verify web app model
        run: |
          test -s site/models/car_parts_classifier.onnx
          test -s site/models/car_part_labels.txt
          ls -lh site/models/car_parts_classifier.onnx
          wc -l site/models/car_part_labels.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy-pages:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
