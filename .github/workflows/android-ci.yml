name: Android Real AI APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'scripts/prepare_real_ai_model.py'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  build-real-ai-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model export tools
        run: python -m pip install --upgrade pip && pip install "ultralytics>=8.3,<9" "huggingface_hub>=0.28" "onnx>=1.17,<2"
      - name: Download and export real AI model
        run: python scripts/prepare_real_ai_model.py
      - name: Verify packaged model
        run: |
          test -s android/app/src/main/assets/car_parts_classifier.onnx
          test -s android/app/src/main/assets/car_part_labels.txt
          ls -lh android/app/src/main/assets/car_parts_classifier.onnx
          wc -l android/app/src/main/assets/car_part_labels.txt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CarMechanicAR-RealAI.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMechanicAR-Android-RealAI
          path: CarMechanicAR-RealAI.apk
          if-no-files-found: error
          retention-days: 30
